[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hookspool"
dynamic = ["version"]
description = "Durable, coalescing intake for inbound webhooks: spool to disk before the 2xx, deliver later, never lose an event."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Jared Zimmerman" }]
keywords = ["webhooks", "webhook relay", "durable queue", "coalescing", "sqlite", "self-hosted", "hermes-agent",
            "ai agents", "pubsub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# The Plaid source verifies an ES256 JWT; nothing else needs a third-party package.
plaid = ["cryptography>=42", "PyJWT>=2.8"]
dev = ["pytest>=8", "ruff", "cryptography>=42", "PyJWT>=2.8"]

[project.scripts]
hookspool = "hookspool.__main__:main"

[project.urls]
Homepage = "https://jaredzimmerman.github.io/hookspool/"
Documentation = "https://jaredzimmerman.github.io/hookspool/"
Source = "https://github.com/jaredzimmerman/hookspool"
Issues = "https://github.com/jaredzimmerman/hookspool/issues"
Changelog = "https://github.com/jaredzimmerman/hookspool/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hookspool.__version__" }

[tool.setuptools.packages.find]
include = ["hookspool*"]

[tool.setuptools.package-data]
hookspool = ["migrations/*.sql", "bobbins/*/*/bobbin.toml", "bobbins/*/*/README.md", "bobbins/*/*/SETUP.md",
             "bobbins/*/*/AGENTS.md", "bobbins/*/*/captures/*.http", "bobbins/*/*/captures/kit.toml",
             "bobbins/*/*/captures/schemes/*.http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
