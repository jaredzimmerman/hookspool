# nginx.example.conf: reverse proxy in front of hookspool-intake (docs/ARCHITECTURE.md sections 9 and 10).
# Copy to /etc/nginx/conf.d/hookspool.conf (or deploy/local/, gitignored), replace hooks.example.com and
# the certificate paths, then `nginx -t && systemctl reload nginx`.
#
# What the proxy owns, because the intake deliberately does not:
#   * TLS and the hostname.
#   * Request buffering. The intake answers chunked uploads 411 and needs a Content-Length, so the whole
#     body is read by nginx first (`proxy_request_buffering on`, the default, stated for the reader).
#   * Body size. client_max_body_size should equal [intake] max_body_bytes (1 MiB). nginx answers 413
#     itself above it. The intake's effective cap per source is lower: [intake] max_body_bytes is clamped
#     to the route max_bytes (768 KiB in config.example.toml), so a body between 768 KiB and 1 MiB passes
#     nginx and gets the intake's 413. Raise the limits together (deploy/README.md, GitHub row).
#   * Rate limiting (`limit_req`). The intake has no 429 path. Over the limit nginx answers 429, which
#     Pub/Sub, Plaid and Zoom retry and GitHub does not (see deploy/README.md, sweeps).
#   * The path -> X-Hookspool-Route mapping, so provider-side URLs stay stable while routes move.
#
# Only /hooks/<source> is forwarded. /healthz and /metrics are on the intake's port but are never
# exposed here; scrape them on loopback or add an allow-listed location of your own.

upstream hookspool_intake {
    server 127.0.0.1:8650;
    keepalive 16;
    # Below the intake's 30 s idle close (REQUEST_TIMEOUT_S): nginx must drop an idle connection before the
    # intake does, or a request sent on a connection the intake is closing gets a 502 that
    # `proxy_next_upstream off` does not retry (for GitHub, a loss until the redelivery sweep runs).
    keepalive_timeout 20s;
}

# The route hint comes from the path, never from the client. It is a `map` (not a proxy_set_header in
# each location) because nginx stops inheriting server-level proxy_set_header lines in any location that
# sets one of its own; this way every location inherits the same header set. Unlisted paths map to "".
map $uri $hookspool_route {
    default     "";
    /github/ci  ci;
    /github/prs prs;
}

# One zone per source, keyed by client address, so a flood on one path cannot starve another.
# 10 MB holds roughly 160,000 addresses per zone. Rates are per address: Pub/Sub, Zoom and GitHub
# deliver from a handful of addresses, so size the burst for a backlog draining after an outage.
limit_req_zone $binary_remote_addr zone=hs_github:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=hs_plaid:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=hs_gmail:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=hs_gcal:10m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=hs_drive:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=hs_zoom:10m     rate=10r/s;
limit_req_zone $binary_remote_addr zone=hs_trello:10m   rate=10r/s;
limit_req_status 429;

# The Gmail push token travels in the query string, and nginx's default access log (the "combined"
# format) writes it, as do its error log lines (they carry the request line and the upstream URI).
# Access logs: use this format, which logs the path ($uri) only, never $request or $request_uri, and
# switch the log off in the port-80 server. Error log: see the /hooks/gmail location below.
log_format hookspool '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                     '$request_time "$http_user_agent"';

server {
    listen 80;
    server_name hooks.example.com;

    # Without this line the server inherits the default "combined" access log, which writes $request
    # (the query string included). This server only answers ACME and redirects.
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hooks.example.com;

    ssl_certificate     /etc/letsencrypt/live/hooks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/hookspool.access.log hookspool;

    # Equal to [intake] max_body_bytes. A body over this is a 413 the sender does not retry (GitHub)
    # or retries pointlessly (the rest); raise both together (deploy/README.md, GitHub row). The
    # intake's effective per-source cap is the route max_bytes (768 KiB in the example), below this.
    client_max_body_size 1m;
    client_body_buffer_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # this proxy is the edge: do not pass a client-supplied chain on
    proxy_set_header X-Hookspool-Route $hookspool_route;   # overwrites anything the client sent
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;            # the intake needs Content-Length; it answers chunked with 411
    proxy_buffering on;
    proxy_connect_timeout 3s;              # the intake is on loopback: fail fast, the sender retries
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;                # the intake answers after one fsync, not after delivery
    proxy_next_upstream off;               # never replay a POST to a second upstream

    # Nothing is served by default. Unknown paths do not reach the intake.
    location / {
        return 404;
    }

    # GitHub: one URL per route; the `map` above turns the path into X-Hookspool-Route.
    location = /github/ci {
        limit_req zone=hs_github burst=60 nodelay;
        proxy_pass http://hookspool_intake/hooks/github;
    }
    location = /github/prs {
        limit_req zone=hs_github burst=60 nodelay;
        proxy_pass http://hookspool_intake/hooks/github;
    }

    location = /hooks/plaid {
        limit_req zone=hs_plaid burst=20 nodelay;
        proxy_pass http://hookspool_intake;
    }

    # Pub/Sub push: the subscription's endpoint is https://<host>/hooks/gmail?token=<push token>.
    # The token is in the URL, and nginx's error log writes `request: "POST /hooks/gmail?token=..."` and
    # `upstream: "http://127.0.0.1:8650/hooks/gmail?token=..."` for every limit_req rejection and every 502 while
    # the intake restarts. This location therefore has its own error log at `crit`, which keeps those
    # error and warn lines out, and rejections are logged at `warn`. The access log (status 429/502,
    # path only) still shows that they happened. Residual exposure: README, Known limits.
    location = /hooks/gmail {
        error_log /var/log/nginx/hookspool.gmail.error.log crit;
        limit_req_log_level warn;
        limit_req zone=hs_gmail burst=60 nodelay;
        proxy_pass http://hookspool_intake;
    }

    location = /hooks/gcal {
        limit_req zone=hs_gcal burst=30 nodelay;
        proxy_pass http://hookspool_intake;
    }

    location = /hooks/drive {
        limit_req zone=hs_drive burst=30 nodelay;
        proxy_pass http://hookspool_intake;
    }

    location = /hooks/zoom {
        limit_req zone=hs_zoom burst=30 nodelay;
        proxy_pass http://hookspool_intake;
    }

    # Trello registers this exact URL as the callback; the source's callback_url must match it byte for byte.
    location = /hooks/trello {
        limit_req zone=hs_trello burst=30 nodelay;
        proxy_pass http://hookspool_intake;
    }
}
