# hookspool config.example.toml: a complete, working shape for one host. Copy to
# <HOOKSPOOL_HOME>/config.toml (or deploy/local/config.toml, which is gitignored) and replace every
# placeholder: the /etc/hookspool/... secret files, the /opt/hookspool/... script paths, the
# callback URL and the alert command. `hookspool check` is the judge; both services run it before
# they start. Reference: docs/architecture/ARCHITECTURE.md section 15.
#
# Layout assumed below (change it freely, but keep the unit files' ReadWritePaths in step):
#   /var/lib/hookspool                 state dir: config.toml, spool.db, dispatch.lock
#   /var/lib/hookspool/scripts/<name>  one state_dir per script destination
#   /etc/hookspool/secrets/<source>    one-line secret files, mode 0600
#   /etc/hookspool/<name>.env          KEY=value env files for script destinations, mode 0600
#   /opt/hookspool/scripts             your own scripts for script destinations

[spool]
home = "/var/lib/hookspool"            # HOOKSPOOL_HOME overrides
store_raw = true                       # keep original bodies so replay and `source test` can re-verify

[intake]
listen = "127.0.0.1:8650"              # loopback only; the reverse proxy is the only client
max_body_bytes = 1048576               # 413 above this. Raise it together with the source, route and
                                       # destination limits below (see the GitHub row in docs/operations/sweeps.md)

[dispatch]
parallel = 4

[coalesce]                             # defaults for every window field; span, source and route override
max_events = 500
max_bytes = 786432                     # 768 KiB, at most 0.75 x the destination's max_body_bytes

[limits]
min_free_bytes = 536870912             # the intake answers 503 below this much free space

[retention]
delivered_days = 7
attempts_days = 30
dropped_days = 7
issues_days = 90

[alerts]
# The deployment replaces this with its chat sender; hookspool appends the alert text as the last argument.
argv = ["logger", "-t", "hookspool"]
rate_limit_s = 1800

[hermes]
base_url = "http://127.0.0.1:8644"     # the gateway's webhook listener
subscriptions_path = "~/.hermes/webhook_subscriptions.json"   # routes and secrets are read from here
max_body_bytes = 1048576               # must match the gateway's own webhook limit
legacy_signature = true                # also send X-Hub-Signature-256

# Spans (quiet_s, max_s) are the only per-product coalescing decision. The defaults are below; edit or add.
[spans]
burst = { quiet_s = 120, max_s = 600 }     # code and CI
mail = { quiet_s = 30, max_s = 120 }       # mail, boards
calendar = { quiet_s = 45, max_s = 180 }
sync = { quiet_s = 60, max_s = 300 }       # bank backfills
immediate = { quiet_s = 0, max_s = 0 }     # meetings, security

# ---------------------------------------------------------------------------------------------
# Bobbins. One [bobbins.<instance>] table per service, one proxy location each (deploy/nginx.example.conf).
# `hookspool bobbin expand` prints the ordinary [sources.*] tables they become.
# ---------------------------------------------------------------------------------------------

# GitHub, as the `github.repo` bobbin (hookspool/bobbins/github/repo/README.md). The path chooses the route: the proxy
# sets X-Hookspool-Route to "ci" or "prs" and the routes below match it; a request that names no route goes
# to the "*" output. GitHub does not retry a failed delivery: the sweep in docs/operations/sweeps.md redelivers.
[bobbins.github]
bobbin = "github.repo"
secrets.secret = { file = "/etc/hookspool/secrets/github" }
outputs = { "*" = "hermes:github-prs" }

# Plaid, as the `plaid.items` bobbin (hookspool/bobbins/plaid/items/README.md): ES256 JWT verified against Plaid's published
# keys. The client id and secret are used only to fetch those keys. Plaid retries for hours.
[bobbins.plaid]
bobbin = "plaid.items"
settings = { env = "production" }      # or "sandbox" / "development"
secrets.client_id = { env_file = "/etc/hookspool/plaid.env", key = "PLAID_CLIENT_ID" }
secrets.secret = { env_file = "/etc/hookspool/plaid.env", key = "PLAID_SECRET" }
outputs = { "*" = "hermes:plaid" }

# Gmail through Cloud Pub/Sub push, as the `google.gmail` bobbin (hookspool/bobbins/google/gmail/README.md). One batch per
# mailbox; the processor reads the mailbox once for all the pushes in it. The URL is /hooks/gmail?token=...
# Its credentials are read by the processor only (file references, never env). Leave out secrets.cred_agent and
# `agent` when there is no assistant mailbox, and out of `outputs` what you do not want.
[bobbins.gmail]
bobbin = "google.gmail"
secrets.push_token = { file = "/etc/hookspool/secrets/gmail_push_token" }
secrets.cred_owner = { file = "/etc/hookspool/google/owner.json" }
secrets.cred_agent = { file = "/etc/hookspool/google/assistant.json" }
settings = { owner = "owner@example.com", agent = "assistant@example.com", tz = "America/New_York" }
outputs = { scheduling = "hermes:mail-scheduling", agent-mail = "hermes:assistant-mail", mailbox-changed = "hermes:mail-changed" }
# expect = true applies the bobbin's recommended expect_every_s (4 days of silence opens a source_silent issue:
# the watch lapsed?). Leave it off until the sender points here (docs/operations/running.md, rollout order).
expect = false

# Google Calendar, as the `google.calendar` bobbin (hookspool/bobbins/google/calendar/README.md). Watch channels expire (at most a
# week): keep the renewal sweep running. `changed` goes to a script of your own, here a refresh script.
[bobbins.calendar]
bobbin = "google.calendar"
secrets.channel_token = { file = "/etc/hookspool/secrets/calendar_channel_token" }
secrets.cred = { file = "/etc/hookspool/google/owner.json" }
settings = { tz = "America/New_York", own = ["owner@example.com", "assistant@example.com"] }
outputs = { conflict = "hermes:calendar-conflict", brief = "hermes:calendar-brief", changed = "script:calendar-refresh" }
expect = false                         # true: 2 days of silence opens a source_silent issue (the channel lapsed?)

# Google Drive, as the `google.drive` bobbin (hookspool/bobbins/google/drive/README.md). Reports file ids and metadata, never
# contents. Watch channels expire (at most a week): keep the renewal sweep running (SETUP.md).
[bobbins.drive]
bobbin = "google.drive"
secrets.channel_token = { file = "/etc/hookspool/secrets/drive_channel_token" }
secrets.cred = { file = "/etc/hookspool/google/owner.json" }
settings = { own = ["owner@example.com"], skip_mime_types = ["application/vnd.google-apps.folder"] }
outputs = { file-changed = "hermes:drive-changed", file-created = "hermes:drive-created", file-shared = "hermes:drive-shared" }
expect = false                         # true: 7 days of silence opens a source_silent issue

# Zoom event subscriptions, as the `zoom.meetings` bobbin (hookspool/bobbins/zoom/meetings/README.md). The URL-validation handshake is
# answered only after the signature checks out.
[bobbins.meetings]
bobbin = "zoom.meetings"
secrets.webhook_secret = { file = "/etc/hookspool/secrets/zoom_webhook_secret" }
outputs = { "*" = "hermes:meetings" }

# Trello, as the `atlassian.trello` bobbin (hookspool/bobbins/atlassian/trello/README.md): base64 HMAC-SHA1 over the body plus the
# callback URL, which must be byte for byte what the webhook was registered with. Trello's unsigned HEAD
# handshake is answered with an empty 200.
[bobbins.trello]
bobbin = "atlassian.trello"
secrets.secret = { file = "/etc/hookspool/secrets/trello" }
settings = { callback_url = "https://hooks.example.com/hooks/trello" }
outputs = { "*" = "hermes:trello" }

# ---------------------------------------------------------------------------------------------
# Routes. An instance's "*" output (its source's `action`) covers everything that no route claims.
# ---------------------------------------------------------------------------------------------

[[routes]]
name = "github-ci"
source = "github"
match = { route_hint = "ci" }
destination = "hermes:github-ci"

[[routes]]
name = "github-prs"
source = "github"
match = { route_hint = "prs" }
destination = "hermes:github-prs"
quiet_s = 60                           # route-level override of one field; the rest inherit

# ---------------------------------------------------------------------------------------------
# Destinations. A `hermes:<route>` needs no table unless you tune it; Hermes route names, secrets and
# profiles come from subscriptions_path.
# ---------------------------------------------------------------------------------------------

[destinations."hermes:github-ci"]
max_inflight = 2

# A receiver that expects the sender's original payload, one request per event (a Hermes route whose
# prompt template reads {pull_request.title}): unwrap. Give the routes that feed it span = "immediate"
# (quiet_s = max_s = 0) so each event is its own batch; the gateway route may then keep its own
# `events` filter. See docs/configuration/README.md, "Unwrap: one request per event".
# [destinations."hermes:github-releases"]
# unwrap = true
# event_header = "X-GitHub-Event"
# dedup_header = "X-GitHub-Delivery"

# A follow-up of your own for the google.calendar bobbin's `changed` output (it receives the output item as its event
# payload; the changed event ids and dates are in it). Delivered, retried and dead-lettered like any script.
# Every state_dir must be in the dispatch unit's ReadWritePaths (deploy/hookspool-dispatch.service); the
# bobbins' own state directories default to <home>/bobbins/<instance>, below the home that is already there.
[destinations."script:calendar-refresh"]
argv = ["/opt/hookspool/venv/bin/python", "/opt/hookspool/scripts/refresh_events.py"]
timeout_s = 300
