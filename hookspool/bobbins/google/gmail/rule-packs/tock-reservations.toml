subject_regex = '\b(?:reservation|booking)s?\b.{0,60}\b(?:modified|changed|updated)\b|\b(?:modified|changed|updated|modification)\b.{0,20}\b(?:reservation|booking)s?\b'
skip = ["rate your", "how was your", "leave a review", "write a review", "recommended for you"]
skip_subject = ["privacy", "policy", "policies", "terms of", "terms and conditions", "offer", "promo", "coupon", "% off", "deal", "sale", "sweepstakes", "giveaway", "newsletter", "survey", "become a", "prime day", "guarantee", "has been created", "was created", "welcome to", "verify your", "confirm your email", "email confirmation"]
[rules.extract]
restaurant = '(?:\bat\s+|\brestaurant:\s*)([^!.,:\n]{2,60}?)(?=\s+(?:is|has|was|on|for|-)\b|\s*[!.,:]|\s*$)'
date_time = '\b((?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+[a-z]{3,9}\.?\s+\d{1,2}(?:,?\s+\d{4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s?[ap]m)?)'
party_size = '(?:party of|table for|party size:?|guests?:?|seats?:?)\s*(\d{1,2})\b'
confirmation_code = '(?:confirmation|reservation)\s*(?:code|number|no\.?|#|id)\s*[:#]?\s*(?:is\s+)?([a-z0-9][a-z0-9-]{3,19})\b'

