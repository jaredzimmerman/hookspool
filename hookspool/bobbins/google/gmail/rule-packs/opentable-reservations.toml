# OpenTable: reservation mail (patterns written from the provider's published email conventions; not yet checked against real mail).
# Sender entries match the platform's own domains; restaurant-branded senders need your own rule.
# Every rule needs order or reservation context in the subject (a bare word such as 'updated' or 'booking' is not enough),
# and skip_subject vetoes policy, marketing, account and review-request subjects (whole words, outside double-quoted
# text). Nothing is vetoed on the body, so a feedback or recommendations footer does not hide a real order. A rule of
# a built-in pack never claims mail Gmail filed as promotions, social or forums.
[pack]
name = "opentable-reservations"
status = "unverified"
description = "OpenTable reservation mail: confirmation, reminder, modification, cancellation and waitlist messages"

[[rules]]
name = "cancellation"
kind = "cancellation"
from = ["opentable.com"]  # hookspool-scan: allow: the service's own sender domains
subject_regex = '\b(?:reservation|booking)s?\b.{0,60}\bcancel(?:l?ed|lation)\b|\bcancel(?:l?ed|lation)\b.{0,40}\b(?:reservation|booking)s?\b'
skip_subject = ["privacy", "policy", "policies", "terms of", "terms and conditions", "special offer", "exclusive offer", "limited-time offer", "limited time offer", "offer ends", "new offer", "promo code", "promotion", "coupon", "% off", "deals", "deal of the day", "flash sale", "on sale", "sale ends", "sweepstakes", "giveaway", "newsletter", "survey", "become a", "prime day", "guarantee", "perks", "earnings", "membership", "rewards", "your points", "bonus points", "points balance", "earn points", "dining points", "dashpass", "rate your", "how was your", "leave a review", "write a review", "recommended for you", "has been created", "was created", "welcome to", "verify your", "confirm your email", "email confirmation", "opentable points"]
[rules.extract]
restaurant = '(?:\bat\s+|\brestaurant:\s*)([^!.,:\n]{2,60}?)(?=\s+(?:is|has|was|on|for|-)\b|\s*[!.,:]|\s*$)'
date_time = '\b((?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+[a-z]{3,9}\.?\s+\d{1,2}(?:,?\s+\d{4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s?[ap]m)?)'
party_size = '(?:party of|table for|party size:?|guests?:?|seats?:?)\s*(\d{1,2})\b'
confirmation_code = '(?:confirmation|reservation)\s*(?:code|number|no\.?|#|id)\s*[:#]?\s*(?:is\s+)?([a-z0-9][a-z0-9-]{3,19})\b'

