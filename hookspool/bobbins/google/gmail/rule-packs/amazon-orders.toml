subject_regex = '^delivered:|your\b.{0,30}?\b(?:order|package|parcel|item|shipment|delivery)s?\b.{0,40}\b(?:was|been|has been) delivered\b|your\b.{0,30}?\b(?:order|package|parcel|item|shipment|delivery)s?\b.{0,20}\bhas arrived\b'
skip_subject = ["privacy", "policy", "policies", "terms of", "terms and conditions", "special offer", "exclusive offer", "limited-time offer", "limited time offer", "offer ends", "new offer", "promo code", "promotion", "coupon", "% off", "deals", "deal of the day", "flash sale", "on sale", "sale ends", "sweepstakes", "giveaway", "newsletter", "survey", "become a", "prime day", "guarantee", "perks", "earnings", "membership", "rewards", "your points", "bonus points", "points balance", "earn points", "dining points", "dashpass", "rate your", "how was your", "leave a review", "write a review", "recommended for you", "has been created", "was created", "welcome to", "verify your", "confirm your email", "email confirmation"]
[rules.extract]
order_id = '\b(\d{3}-\d{7}-\d{7})\b'
item = '^delivered:\s*["“]?(.+?)["”]?\s*$'
delivered_on = '(?:delivered)[:\s]+((?:[a-z]+day,?\s+)?(?:today|yesterday|[a-z]{3,9}\.?\s+\d{1,2}))'

