# test values for `hookspool bobbin check`
body_signed = false            # the push token in the URL authenticates the sender, not the body

[secrets]
push_token = "test-gmail-push-token-PAYLOAD-SENTINEL-7f3a"
cred_owner = '{"client_id": "test-client-id", "client_secret": "test-client-secret", "refresh_token": "test-refresh-token", "token_uri": "https://oauth2.example.com/token"}'

[settings]
owner = "owner@example.com"

[[http]]                       # the OAuth refresh of the test credential
method = "POST"
url = "https://oauth2.example.com/token"
status = 200
json = { access_token = "test-access-token", expires_in = 3600 }
