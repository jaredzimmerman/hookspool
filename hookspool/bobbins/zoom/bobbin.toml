name = "zoom"
version = "1"
summary = "Zoom event subscriptions: meeting and webinar events, signed with a timestamped HMAC, and the endpoint URL validation"

[source]
module = "source"
span = "immediate"
sender_retries = true
proxy = "pass /hooks/zoom through unchanged, with the x-zm-request-timestamp and x-zm-signature headers"

[secrets.webhook_secret]
description = "the Secret Token of the Zoom app's Event Subscription, which signs every delivery and the URL validation"

[outputs."*"]
description = "every accepted Zoom event; the event name (for example meeting.ended) is the event type"
