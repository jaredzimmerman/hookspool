name = "acme.kitproc"
version = "1"
summary = "Kit fixture: a processor that asks an API what changed"

[provider]
vendor = "Acme"
product = "Kitproc"
homepage = "https://github.com"
webhook_docs = "https://docs.github.com/en/webhooks"
signature_docs = "https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries"
api_docs = "https://docs.github.com/en/rest"

[source]
module = "source"
span = "burst"
sender_retries = false

[secrets.token]
description = "the push token"
[secrets.api_key]
description = "the API key the processor uses"
processor = true

[settings.owner]
description = "whose account"
type = "string"
required = true
[settings.limit]
description = "items per pass"
type = "int"
default = 10

[processor]
module = "processor"
timeout_s = 60
state = true

[outputs.changed]
description = "an item changed"
