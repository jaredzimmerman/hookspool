name = "acme.kitcode"
version = "1"
summary = "Kit fixture: a code source with a dedup id"

[provider]
vendor = "Acme"
product = "Kitcode"
homepage = "https://github.com"
webhook_docs = "https://docs.github.com/en/webhooks"
signature_docs = "https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries"

[source]
module = "source"
span = "burst"
sender_retries = true

[secrets.secret]
description = "the signing secret"

[outputs."*"]
description = "every accepted event"
