name: bobbin

# The scorecard of every bobbin a pull request adds or changes: the same `hookspool bobbin check` a
# contributor runs. Plain pull_request (not its _target variant), so a fork's code runs with a read-only
# token and no secrets. Labels and the PR comment are written by bobbin-label.yml, a separate run that
# reads the uploaded scorecards and never runs this code.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bobbin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bobbin-check:
    name: bobbin scorecards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # the changed files are found against the PR's base commit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Bobbin scorecards
        # finds the changed bobbins, runs `hookspool bobbin check <dir> --report json --online` on each (--online:
        # the advisory provider-links row fetches each bobbin's [provider] pages; it never fails the job), writes the
        # scorecards to the job summary and to $RUNNER_TEMP/bobbin-reports (outside the checkout, so the
        # reports are never untracked files that a later bobbin's scope check would count as a core change),
        # and exits 1 if a required check fails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/plugin_ci.py bobbins --online --base "$BASE_SHA" --pr "$PR_NUMBER" --report-dir "$RUNNER_TEMP/bobbin-reports"
      - name: Upload the scorecards
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bobbin-reports
          path: ${{ runner.temp }}/bobbin-reports/
          if-no-files-found: ignore
          retention-days: 14
